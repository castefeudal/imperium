name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: imperium
          POSTGRES_PASSWORD: imperium_dev
          POSTGRES_DB: imperium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imperium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations (fresh database)
        run: |
          sudo -u postgres psql -c "ALTER USER imperium WITH SUPERUSER;" || true
          pnpm --filter @imperium/database exec tsx src/migrate.ts
        env:
          DATABASE_URL: postgresql://imperium:imperium_dev@127.0.0.1:5432/imperium

      - name: Seed
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://imperium:imperium_dev@127.0.0.1:5432/imperium

      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://imperium:imperium_dev@127.0.0.1:5432/imperium

      - name: Build
        run: pnpm build
        env:
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Smoke (API against real postgres/redis)
        run: |
          pnpm --filter @imperium/database exec tsx src/migrate.ts
          pnpm --filter @imperium/database exec tsx src/seed.ts
          cd apps/api
          (PORT=3101 nohup pnpm start > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3101/ready > /dev/null && break
            sleep 1
          done
          cd ../..
          SMOKE_URL=http://127.0.0.1:3101 node scripts/smoke.mjs
        env:
          DATABASE_URL: postgresql://imperium:imperium_dev@127.0.0.1:5432/imperium
          REDIS_URL: redis://127.0.0.1:6379
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Web E2E (smoke)
        run: pnpm test:e2e
        env:
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
